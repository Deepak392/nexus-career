name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Create local CI environment
        run: cp .env.example .env

      - name: Build and start PostgreSQL and Django
        run: docker compose up -d --build --wait db backend

      - name: Verify required Python packages
        run: |
          docker compose exec -T backend python -c "import corsheaders, drf_spectacular, rest_framework_simplejwt; print('Backend dependencies OK')"

      - name: Django system check
        run: docker compose exec -T backend python manage.py check

      - name: Check for missing migrations
        run: docker compose exec -T backend python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: docker compose exec -T backend python manage.py migrate

      - name: Run backend tests
        run: docker compose exec -T backend python manage.py test

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color backend db

      - name: Shut down services
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Report frontend dependency audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8")
          );
          const vulnerabilities = report.vulnerabilities || {};
          const entries = Object.entries(vulnerabilities);
          console.log(`npm audit: ${entries.length} affected package(s)`);
          for (const [name, finding] of entries) {
            const fix = typeof finding.fixAvailable === "object"
              ? JSON.stringify(finding.fixAvailable)
              : String(finding.fixAvailable);
            console.log(
              `${finding.severity}: ${name}; direct=${finding.isDirect}; range=${finding.range}; fixAvailable=${fix}`
            );
          }
          NODE

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
