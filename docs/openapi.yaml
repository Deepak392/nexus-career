          description: ''
  /api/v1/admin/reports/:
    get:
      operationId: api_v1_admin_reports_retrieve
      description: Retrieves a paginated list of recruitment activities across the
        platform. Supports filtering by date range (start_date, end_date), activity_type,
        company, and status. Restricted to IPC and System administrators.
      summary: List recruitment activity reports
      parameters:
      - in: query
        name: activity_type
        schema:
          type: string
        description: Filter by category (OPPORTUNITY, APPLICATION, COMPANY, USER).
      - in: query
        name: company
        schema:
          type: string
        description: Filter by company name or ID.
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter up to ISO date (inclusive).
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page (max 50).
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter from ISO date (inclusive).
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (PUBLISHED, SUBMITTED, VERIFIED, etc.).
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityReportItem'
          description: ''
        '400':
          description: Invalid filter parameters or date range.
        '401':
          description: Unauthenticated request.
        '403':
          description: 'Forbidden: Requires IPC or System administrator.'
