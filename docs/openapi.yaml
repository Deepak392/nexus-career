        schema:
          type: string
        description: Filter by company name or ID.
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter up to ISO date (inclusive).
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter from ISO date (inclusive).
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (PUBLISHED, SUBMITTED, VERIFIED, etc.).
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: CSV report file download.
        '400':
          description: Invalid filter parameters or date range.
        '401':
          description: Unauthenticated request.
        '403':
          description: 'Forbidden: Requires IPC or System administrator.'
  /api/v1/admin/users/{id}/reactivate/:
    post:
      operationId: api_v1_admin_users_reactivate_create
      description: |-
        R3: Reactivates a suspended user account.

        Restricted to authorized IPC administrators.
        Reactivation of an active (non-suspended) account returns 400.
      summary: Reactivate suspended user account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountActionResponse'
          description: ''
        '400':
          description: User is not currently suspended.
        '403':
          description: Forbidden action.
        '404':
          description: User not found.
  /api/v1/admin/users/{id}/suspend/:
    post:
      operationId: api_v1_admin_users_suspend_create
      description: |-
        R3: Suspends an active user account.

        Restricted to authorized IPC administrators.
        Enforces that administrators cannot suspend themselves, IPC admins cannot suspend
        System Admins, and already suspended users return 400.
      summary: Suspend user account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSuspensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserSuspensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSuspensionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountActionResponse'
          description: ''
        '400':
          description: Disallowed self-suspension or user already suspended.
        '403':
          description: Forbidden action on protected administrator account.
        '404':
          description: User not found.
