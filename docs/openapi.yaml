openapi: 3.0.3
info:
  title: Nexus Career API
  version: 1.0.0
  description: Versioned REST API for Nexus Career. Only implemented and registered
    routes are included.
paths:
  /api/v1/admin/alumni/{id}/verify/:
    post:
      operationId: api_v1_admin_alumni_verify_create
      description: Allows authorized IPC administrators to review graduation proof
        and make a verification decision for an alumnus profile. Updates verification
        status, dispatches an audit event, and prevents unauthorized access.
      summary: Verify or reject an alumnus profile
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumniVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlumniVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlumniVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniVerificationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid decision or disallowed status transition.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Unauthenticated request.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: 'Forbidden: requester lacks IPC administrator role or
                  self-verification.'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Alumnus profile not found.
          description: ''
  /api/v1/admin/alumni/pending/:
    get:
      operationId: api_v1_admin_alumni_pending_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlumniProfileList'
          description: ''
  /api/v1/admin/audit-logs/:
    get:
      operationId: api_v1_admin_audit_logs_list
      description: |-
        R4: Authorized audit trail viewing API.

        Restricted to authorized IPC or System administrators.
        Exposes actor, action, target, and timestamp without leaking secrets.
        Supports filtering by action, target_type, and actor username.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogEntryList'
          description: ''
  /api/v1/admin/dashboard/metrics/:
    get:
      operationId: api_v1_admin_dashboard_metrics_retrieve
      description: Retrieves aggregate placement workflow and platform KPI metrics.
        Restricted to authorized IPC and System administrators.
      summary: Get IPC Admin Dashboard Metrics
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardMetrics'
          description: Aggregated platform metrics successfully retrieved.
        '401':
          description: Unauthenticated request.
        '403':
          description: 'Forbidden: Requires IPC or System administrator role.'
  /api/v1/admin/metrics/:
    get:
      operationId: api_v1_admin_metrics_retrieve
