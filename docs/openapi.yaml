components:
  schemas:
    ActivityReportItem:
      type: object
      description: 'R6: Serializer for an individual recruitment activity report record.'
      properties:
        id:
          type: string
          description: Unique event or activity identifier.
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp of the activity.
        activity_type:
          type: string
          description: Category of activity (e.g. OPPORTUNITY, APPLICATION, COMPANY,
            USER).
        action:
          type: string
          description: Action descriptor (e.g. OPPORTUNITY_APPROVED, APPLICATION_SUBMITTED).
        actor:
          type: string
          description: Username of the user who performed the activity.
        company:
          type: string
          default: ''
          description: Associated company name.
        target_type:
          type: string
          description: Target entity model or type.
        target_id:
          type: string
          description: Identifier of the target entity.
        status:
          type: string
          default: ''
          description: Status outcome of the activity.
        details:
          type: object
          additionalProperties: {}
          description: Contextual metadata or details.
      required:
      - action
      - activity_type
      - actor
      - id
      - target_id
      - target_type
      - timestamp
    AdminDashboardMetrics:
      type: object
      properties:
        active_opportunities:
          type: integer
          description: Number of published opportunities currently open for applications.
        students:
          type: integer
          description: Total number of active student accounts.
        verified_recruiters:
          type: integer
          description: Number of verified companies or recruiters.
        applications:
          type: integer
          description: Total number of student applications submitted.
        pending_approvals:
          type: integer
          description: Number of opportunities awaiting IPC approval.
        total_opportunities:
          type: integer
          description: Total number of all opportunities across all lifecycle states.
        pending_companies:
          type: integer
          description: Number of companies pending IPC verification.
        verified_alumni:
          type: integer
          description: Number of verified alumni profiles.
      required:
      - active_opportunities
      - applications
      - pending_approvals
      - students
      - verified_recruiters
    AlumniEngagementMetrics:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        accepted:
          type: integer
        referred:
          type: integer
        declined:
          type: integer
        student_interactions:
          type: integer
        is_open_to_referrals:
          type: boolean
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
      required:
      - accepted
      - declined
      - is_open_to_referrals
      - pending
      - referred
      - student_interactions
      - total
      - verification_status
    AlumniProfile:
      type: object
      properties:
        id:
