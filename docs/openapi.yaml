  /api/v1/admin/recruiters/{id}/verify/:
    post:
      operationId: api_v1_admin_recruiters_verify_create
      description: Allows authorized IPC administrators to review and make a verification
        decision for an eligible recruiter. Updates the company verification status,
        records the acting administrator and timestamp, and logs an audit record.
      summary: Verify or reject a recruiter / company
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecruiterVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruiterVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterVerificationResponse'
          description: Verification decision successfully recorded.
        '400':
          description: Invalid verification status or disallowed status transition.
        '401':
          description: Unauthenticated request.
        '403':
          description: 'Forbidden: requester lacks IPC administrator role or self-verification.'
        '404':
          description: Recruiter or associated company not found.
