
services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: nexus_career
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_career"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexus_postgres_data:
